plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    // Modrinth's Maven — used for Create Fly, ModMenu, and CC: Tweaked below.
    // exclusiveContent restricts it to only the maven.modrinth group so it doesn't
    // shadow-resolve unrelated artifacts. See https://support.modrinth.com/en/articles/8801191
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ctc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Create Fly (hard dependency; this mod is a Create addon) ---
    // Create has NO official Fabric build for 1.21.1, and its official Fabric fork
    // never passed that version at all. Create Fly (https://modrinth.com/mod/create-fly)
    // is the actively maintained community fork this now targets instead — confirm
    // you're on its latest 1.21.11 build at build time, coordinates drift often:
    // https://modrinth.com/mod/create-fly/versions
    modImplementation "maven.modrinth:create-fly:${project.create_fly_version}"

    // --- CC: Tweaked (soft dependency, ComputerCraft compat) ---
    // Version string is a best guess — confirm the real 1.21.11 version at
    // https://modrinth.com/mod/cc-tweaked/versions before building.
    modCompileOnly "maven.modrinth:cc-tweaked:${project.cc_tweaked_version}"

    // --- ModMenu (optional, lets our config screen appear in Mod Menu) ---
    modCompileOnly "maven.modrinth:modmenu:17.0.0-beta.2"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId project.archives_base_name
            from components.java
        }
    }
    repositories { }
}
