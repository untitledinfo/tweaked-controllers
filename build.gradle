plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Create's Fabric maven. VERIFY this URL/coordinate against the current
    // Create-Fabric release before building — repo layout changes between versions.
    maven { url = 'https://maven.createmod.net/' ; name = 'Create' }
    // CC: Tweaked's maven.
    maven { url = 'https://squiddev.cc/maven/' ; name = 'CC: Tweaked' }
    // Registrate (Create's registration helper) if the Fabric build still depends on it.
    maven { url = 'https://maven.tterrag.com/' ; name = 'tterrag maven' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ctc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Create (hard dependency; this mod is a Create addon) ---
    // ARTIFACT COORDINATE UNVERIFIED — swap in the real one from Create's
    // published Fabric maven / Modrinth "Featured" file for 1.21.1 before building.
    modImplementation "com.simibubi.create:create-fabric-1.21.1:${project.create_version}"

    // --- CC: Tweaked (soft dependency, ComputerCraft compat) ---
    // ARTIFACT COORDINATE UNVERIFIED — same caveat as above.
    modCompileOnly "cc.tweaked:cc-tweaked-1.21.1-fabric-api:${project.cc_tweaked_version}"
    modRuntimeOnly "cc.tweaked:cc-tweaked-1.21.1-fabric:${project.cc_tweaked_version}"

    // --- ModMenu (optional, lets our config screen appear in Mod Menu) ---
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId project.archives_base_name
            from components.java
        }
    }
    repositories { }
}
