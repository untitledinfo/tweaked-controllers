name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No gradlew committed in this project, so install the matching
          # Gradle version directly (see gradle/wrapper/gradle-wrapper.properties)
          gradle-version: '8.10'

      - name: Build
        run: gradle build --stacktrace

      - name: Locate build artifacts
        id: artifacts
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)
          if [ -z "$JAR_PATH" ]; then
            echo "No build jar found in build/libs" >&2
            exit 1
          fi
          JAR_NAME=$(basename "$JAR_PATH")
          SHA1=$(sha1sum "$JAR_PATH" | awk '{print $1}')
          echo "$SHA1  $JAR_NAME" > "build/libs/${JAR_NAME}.sha1"
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "sha1_path=build/libs/${JAR_NAME}.sha1" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "### Build artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jar: \`$JAR_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA1: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.jar_name }}
          path: |
            ${{ steps.artifacts.outputs.jar_path }}
            ${{ steps.artifacts.outputs.sha1_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.jar_path }}
            ${{ steps.artifacts.outputs.sha1_path }}
          generate_release_notes: true
