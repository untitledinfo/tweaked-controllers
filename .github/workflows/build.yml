name: Build

on:
  push:
    branches: [ "main", "dev-*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev-*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Run checks
        run: ./gradlew check --stacktrace

      - name: Locate build outputs
        id: jars
        run: |
          mkdir -p staging
          cp build/libs/*.jar staging/ 2>/dev/null || true
          echo "found=$(ls staging | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: steps.jars.outputs.found != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tweaked-controllers-fabric-${{ github.sha }}
          path: staging/*.jar
          if-no-files-found: warn

      - name: Upload test/build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            build/reports/**
            **/build/reports/**
          if-no-files-found: ignore

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
